<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- Pick1 Ad #3 — "One pick. Every day. 9 sports." (positioning).
     1080×1080. Pure typography + league logos. -->
<title>Pick1 · 9 Sports</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@500;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0b0d;
    --accent: #d4ff3a;
    --line: #1a1d22;
    --muted: #9095a0;
    --dim: #b8bcc1;
  }
  html, body {
    margin: 0; padding: 0;
    width: 1080px; height: 1080px;
    background: var(--bg);
    color: white;
    font-family: 'Archivo', sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  .frame { width: 1080px; height: 1080px; padding: 72px; box-sizing: border-box; display: flex; flex-direction: column; }
  .top-eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 700;
  }
  /* HUGE Anton type, four lines */
  .lines {
    flex: 1;
    display: flex; flex-direction: column; justify-content: center;
    margin: 40px 0;
  }
  .line {
    font-family: 'Anton', sans-serif;
    font-size: 178px;
    line-height: 0.95;
    letter-spacing: -0.025em;
    text-transform: uppercase;
  }
  .line.accent { color: var(--accent); }
  .line.muted { color: var(--muted); }
  /* Stripe with leagues */
  .leagues-row {
    display: flex; flex-wrap: wrap; gap: 18px 22px;
    margin: 32px 0 0 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    color: var(--dim);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 700;
  }
  .leagues-row .l {
    padding: 8px 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
  }
  /* Bottom footer */
  .footer {
    margin-top: 36px;
    padding-top: 28px;
    border-top: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: flex-end;
  }
  .footer-left {
    font-family: 'Archivo', sans-serif;
    color: var(--dim);
    font-size: 24px;
    line-height: 1.4;
    max-width: 600px;
  }
  .footer-left strong { color: white; font-weight: 900; }
  .footer-right {
    display: flex; flex-direction: column; align-items: flex-end; gap: 10px;
  }
  .logo {
    font-family: 'Archivo', sans-serif;
    font-weight: 900;
    font-size: 38px;
    letter-spacing: -0.02em;
    color: white;
  }
  .logo .one {
    background: var(--accent);
    color: var(--bg);
    padding: 2px 12px;
    border-radius: 9px;
    margin-left: 3px;
  }
  .url {
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    color: var(--accent);
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>
<div class="frame">
  <div class="top-eyebrow">● ONE CALIBRATED CALL. EVERY DAY.</div>

  <div class="lines">
    <div class="line">ONE PICK.</div>
    <div class="line muted">EVERY DAY.</div>
    <div class="line accent">9 SPORTS.</div>
  </div>

  <div class="leagues-row">
    <div class="l">NBA</div>
    <div class="l">NFL</div>
    <div class="l">EPL</div>
    <div class="l">MLB</div>
    <div class="l">UFC</div>
    <div class="l">NHL</div>
    <div class="l">F1</div>
    <div class="l">ATP</div>
    <div class="l">Cricket</div>
  </div>

  <div class="footer">
    <div class="footer-left">
      No parlays. No "guaranteed locks."<br/>
      <strong>Just one calibrated call.</strong> Free, daily, in your inbox.
    </div>
    <div class="footer-right">
      <div class="logo">PICK<span class="one">1</span></div>
      <div class="url">pick1.live</div>
    </div>
  </div>
</div>
</body>
</html>
