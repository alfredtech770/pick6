<!doctype html>
<html><head><meta charset="utf-8"/>
<!-- IG grid tile #3 — TOP-RIGHT. Acid green dominant (matches #1 for
     visual rhythm — green/black/green across the top row).
     "$1,499 PRIZE VALUE" — the concrete dollar number that makes the
     prize feel real, not abstract. -->
<title>IG Tile 3 · $1,499</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@500;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1080px;background:#d4ff3a;color:#0a0b0d;font-family:'Archivo',sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
.frame{width:1080px;height:1080px;padding:80px;position:relative;display:flex;flex-direction:column;justify-content:space-between}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:22px;letter-spacing:0.28em;color:#0a0b0d;text-transform:uppercase;font-weight:700}
.eyebrow::before{content:'●';margin-right:14px;font-size:14px;vertical-align:middle}
.amount{font-family:'Anton',sans-serif;font-size:480px;letter-spacing:-0.04em;line-height:0.9;color:#0a0b0d;margin-top:20px}
.dollar{font-size:280px;vertical-align:top}
.label{font-family:'JetBrains Mono',monospace;font-size:32px;letter-spacing:0.2em;color:#0a0b0d;text-transform:uppercase;font-weight:700;margin-top:30px}
.breakdown{font-family:'Archivo',sans-serif;font-size:24px;color:#0a0b0d;line-height:1.4;font-weight:600;margin-top:14px;opacity:0.85}
.footer{display:flex;justify-content:space-between;align-items:flex-end}
.logo{font-family:'Archivo',sans-serif;font-weight:900;font-size:50px;letter-spacing:-0.02em;color:#0a0b0d}
.logo .one{background:#0a0b0d;color:#d4ff3a;padding:3px 14px;border-radius:10px;margin-left:4px}
.free{font-family:'JetBrains Mono',monospace;font-size:20px;color:#0a0b0d;letter-spacing:0.16em;text-transform:uppercase;font-weight:700}
</style></head>
<body>
<div class="frame">
  <div>
    <div class="eyebrow">PRIZE VALUE</div>
    <div class="amount"><span class="dollar">$</span>1,499</div>
    <div class="label">2 WC TICKETS + LIFETIME PRO</div>
    <div class="breakdown">FIFA World Cup group-stage tickets ($500) + Lifetime Pick1 Pro ($999).<br/>No purchase necessary.</div>
  </div>
  <div class="footer">
    <div class="logo">PICK<span class="one">1</span></div>
    <div class="free">FREE TO ENTER</div>
  </div>
</div>
</body></html>
