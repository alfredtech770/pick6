<!doctype html>
<html><head><meta charset="utf-8"/>
<!-- IG grid tile #5 — DEAD CENTER of the grid. Acid green dominant.
     The brand manifesto in one sentence: "Wins AND misses logged
     publicly forever." This is what differentiates Pick1 from every
     tout service. -->
<title>IG Tile 5 · Manifesto</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@500;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1080px;background:#d4ff3a;color:#0a0b0d;font-family:'Archivo',sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
.frame{width:1080px;height:1080px;padding:90px;position:relative;display:flex;flex-direction:column;justify-content:space-between}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:22px;letter-spacing:0.28em;color:#0a0b0d;text-transform:uppercase;font-weight:700}
.eyebrow::before{content:'●';margin-right:14px;font-size:14px;vertical-align:middle}
.headline{font-family:'Anton',sans-serif;font-weight:400;font-size:128px;line-height:0.92;letter-spacing:-0.025em;text-transform:uppercase;margin-top:32px}
.headline em{font-style:normal;text-decoration:underline;text-decoration-thickness:8px;text-underline-offset:14px}
.body{font-family:'Archivo',sans-serif;font-size:30px;color:#0a0b0d;line-height:1.4;font-weight:600;margin-top:40px;max-width:880px}
.body strong{font-weight:900}
.footer{display:flex;justify-content:space-between;align-items:flex-end}
.logo{font-family:'Archivo',sans-serif;font-weight:900;font-size:48px;letter-spacing:-0.02em;color:#0a0b0d}
.logo .one{background:#0a0b0d;color:#d4ff3a;padding:3px 14px;border-radius:10px;margin-left:4px}
.url{font-family:'JetBrains Mono',monospace;font-size:22px;color:#0a0b0d;letter-spacing:0.12em;text-transform:uppercase;font-weight:700}
</style></head>
<body>
<div class="frame">
  <div>
    <div class="eyebrow">PICK1 MANIFESTO</div>
    <div class="headline">EVERY<br/>CALL<br/><em>LOGGED</em><br/>PUBLICLY.</div>
    <div class="body">Wins <strong>AND</strong> misses, timestamped before tip-off.<br/>No cherry-picking. No "guaranteed locks." No edits.</div>
  </div>
  <div class="footer">
    <div class="logo">PICK<span class="one">1</span></div>
    <div class="url">PICK1.LIVE</div>
  </div>
</div>
</body></html>
