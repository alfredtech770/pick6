<!doctype html>
<html><head><meta charset="utf-8"/>
<!-- IG grid tile #8 — BOTTOM-CENTER. Black dominant. The
     against-the-touts manifesto. Differentiation by contrast: what
     Pick1 ISN'T as much as what it is. -->
<title>IG Tile 8 · Pick1 vs Touts</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@500;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1080px;background:#0a0b0d;color:#fff;font-family:'Archivo',sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
.frame{width:1080px;height:1080px;padding:80px;position:relative;display:flex;flex-direction:column;justify-content:space-between}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:22px;letter-spacing:0.28em;color:#d4ff3a;text-transform:uppercase;font-weight:700}
.eyebrow::before{content:'●';margin-right:14px;font-size:14px;vertical-align:middle}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:50px;margin-top:60px}
.col{padding:36px 32px;border-radius:18px;border:2px solid;min-height:600px;display:flex;flex-direction:column}
.col.them{border-color:#1a1d22;background:#111317}
.col.us{border-color:#d4ff3a;background:rgba(212,255,58,0.06)}
.col-label{font-family:'JetBrains Mono',monospace;font-size:18px;letter-spacing:0.2em;text-transform:uppercase;font-weight:700;margin-bottom:30px}
.col.them .col-label{color:#9095a0}
.col.us .col-label{color:#d4ff3a}
.col-name{font-family:'Anton',sans-serif;font-size:88px;line-height:0.92;letter-spacing:-0.025em;text-transform:uppercase;margin-bottom:30px}
.col.them .col-name{color:#666b73}
.col.us .col-name{color:#fff}
.col-list{font-family:'Archivo',sans-serif;font-size:24px;line-height:1.6;font-weight:600}
.col.them .col-list{color:#9095a0;text-decoration:line-through;text-decoration-color:#ff5a36;text-decoration-thickness:3px}
.col.us .col-list{color:#fff}
.col-list-item{margin-bottom:14px}
.footer{display:flex;justify-content:space-between;align-items:flex-end;margin-top:30px}
.logo{font-family:'Archivo',sans-serif;font-weight:900;font-size:38px;letter-spacing:-0.02em;color:#fff}
.logo .one{background:#d4ff3a;color:#0a0b0d;padding:2px 12px;border-radius:9px;margin-left:3px}
.tag{font-family:'JetBrains Mono',monospace;font-size:18px;color:#d4ff3a;letter-spacing:0.16em;text-transform:uppercase;font-weight:700}
</style></head>
<body>
<div class="frame">
  <div>
    <div class="eyebrow">THE DIFFERENCE</div>
    <div class="compare">
      <div class="col them">
        <div class="col-label">TOUTS</div>
        <div class="col-name">PICKS<br/>FOR $$</div>
        <div class="col-list">
          <div class="col-list-item">Hidden losses</div>
          <div class="col-list-item">"Guaranteed lock"</div>
          <div class="col-list-item">$99 / month</div>
          <div class="col-list-item">Cherry-picked records</div>
          <div class="col-list-item">Edit posts after the fact</div>
        </div>
      </div>
      <div class="col us">
        <div class="col-label">PICK1</div>
        <div class="col-name">1 AI<br/>CALL / DAY</div>
        <div class="col-list">
          <div class="col-list-item">Every miss public</div>
          <div class="col-list-item">% confidence, not "lock"</div>
          <div class="col-list-item">Free during launch</div>
          <div class="col-list-item">Timestamped before tip-off</div>
          <div class="col-list-item">No edits, ever</div>
        </div>
      </div>
    </div>
  </div>
  <div class="footer">
    <div class="logo">PICK<span class="one">1</span></div>
    <div class="tag">TRUST &gt; TOUTS</div>
  </div>
</div>
</body></html>
