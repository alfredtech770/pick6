<!doctype html>
<html><head><meta charset="utf-8"/>
<!-- IG grid tile #9 — BOTTOM-RIGHT. Acid green dominant. Brand close.
     Pick1 logo huge, URL, single sentence. This is the "if you got
     here, here's what to do" closer. -->
<title>IG Tile 9 · Pick1</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@500;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1080px;background:#d4ff3a;color:#0a0b0d;font-family:'Archivo',sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
.frame{width:1080px;height:1080px;padding:80px;position:relative;display:flex;flex-direction:column;justify-content:space-between;text-align:center}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:22px;letter-spacing:0.28em;color:#0a0b0d;text-transform:uppercase;font-weight:700;text-align:center}
.eyebrow::before{content:'●';margin-right:14px;font-size:14px;vertical-align:middle}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:40px;text-align:center}
.brand{font-family:'Archivo',sans-serif;font-weight:900;font-size:320px;letter-spacing:-0.04em;color:#0a0b0d;line-height:1;display:flex;align-items:center;justify-content:center}
.brand .one{background:#0a0b0d;color:#d4ff3a;padding:0 32px;border-radius:32px;margin-left:12px;line-height:0.92}
.tagline{font-family:'Anton',sans-serif;font-size:80px;line-height:0.95;letter-spacing:-0.025em;color:#0a0b0d;text-transform:uppercase}
.cta{font-family:'JetBrains Mono',monospace;font-size:28px;letter-spacing:0.16em;color:#0a0b0d;text-transform:uppercase;font-weight:700;padding:18px 36px;border:2px solid #0a0b0d;border-radius:14px;display:inline-block}
.url{font-family:'JetBrains Mono',monospace;font-size:24px;color:#0a0b0d;letter-spacing:0.16em;text-transform:uppercase;font-weight:700}
</style></head>
<body>
<div class="frame">
  <div class="eyebrow">JOIN THE WAITLIST</div>
  <div class="center">
    <div class="brand">PICK<span class="one">1</span></div>
    <div class="tagline">ONE AI PICK / DAY.<br/>EVERY CALL LOGGED.</div>
    <div class="cta">PICK1.LIVE →</div>
  </div>
  <div class="url">@PICK1.LIVE</div>
</div>
</body></html>
