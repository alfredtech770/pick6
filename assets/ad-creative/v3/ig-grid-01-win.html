<!doctype html>
<html><head><meta charset="utf-8"/>
<!-- IG grid tile #1 — TOP-LEFT after all 9 are posted.
     Theme: SWEEPSTAKES hook. Acid green dominant. Boldest typographic
     statement — "WIN" in 240px Anton. Visitors who land on the IG
     profile see this first and instantly know there's a giveaway. -->
<title>IG Tile 1 · WIN</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@500;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1080px;background:#d4ff3a;font-family:'Archivo',sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
.frame{width:1080px;height:1080px;padding:80px;position:relative;display:flex;flex-direction:column;justify-content:space-between}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:22px;letter-spacing:0.28em;color:#0a0b0d;text-transform:uppercase;font-weight:700}
.eyebrow::before{content:'●';margin-right:14px;font-size:14px;vertical-align:middle}
.headline{font-family:'Anton',sans-serif;font-weight:400;color:#0a0b0d;text-transform:uppercase;line-height:0.88;letter-spacing:-0.025em}
.win{font-size:340px}
.subhead{font-size:88px;margin-top:4px}
.tickets{font-size:88px}
.footer-row{display:flex;justify-content:space-between;align-items:flex-end}
.logo{font-family:'Archivo',sans-serif;font-weight:900;font-size:50px;letter-spacing:-0.02em;color:#0a0b0d}
.logo .one{background:#0a0b0d;color:#d4ff3a;padding:3px 14px;border-radius:10px;margin-left:4px}
.cta{font-family:'JetBrains Mono',monospace;font-size:20px;color:#0a0b0d;letter-spacing:0.16em;text-transform:uppercase;font-weight:700}
</style></head>
<body>
<div class="frame">
  <div class="eyebrow">LAUNCH SWEEPSTAKES · MAY 31</div>
  <div>
    <div class="headline win">WIN 2</div>
    <div class="headline subhead">WORLD CUP</div>
    <div class="headline tickets">TICKETS.</div>
  </div>
  <div class="footer-row">
    <div class="logo">PICK<span class="one">1</span></div>
    <div class="cta">FREE TO ENTER →</div>
  </div>
</div>
</body></html>
