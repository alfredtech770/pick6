<!doctype html>
<html><head><meta charset="utf-8"/>
<!-- IG grid tile #2 — TOP-CENTER. Black dominant. Trophy + "Drawn May 31"
     countdown. Visual breather between the two acid-green tiles flanking
     it (#1 and #3). -->
<title>IG Tile 2 · Trophy</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@500;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1080px;background:#0a0b0d;color:#fff;font-family:'Archivo',sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
.frame{width:1080px;height:1080px;padding:80px;position:relative;display:flex;flex-direction:column;justify-content:space-between;
  background:radial-gradient(circle at 50% 35%, rgba(212,255,58,0.18) 0%, transparent 55%),#0a0b0d}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:22px;letter-spacing:0.28em;color:#d4ff3a;text-transform:uppercase;font-weight:700;text-align:center}
.trophy{font-size:520px;text-align:center;line-height:1;filter:drop-shadow(0 0 80px rgba(212,255,58,0.5));margin-top:20px}
.deadline{text-align:center}
.drawn{font-family:'JetBrains Mono',monospace;font-size:24px;letter-spacing:0.2em;color:#d4ff3a;text-transform:uppercase;font-weight:700;margin-bottom:10px}
.date{font-family:'Anton',sans-serif;font-size:120px;letter-spacing:-0.02em;color:#fff;text-transform:uppercase;line-height:1}
.sub{font-family:'JetBrains Mono',monospace;font-size:18px;color:#9095a0;letter-spacing:0.16em;text-transform:uppercase;margin-top:14px;text-align:center}
</style></head>
<body>
<div class="frame">
  <div class="eyebrow">★ THE PRIZE</div>
  <div class="trophy">🏆</div>
  <div class="deadline">
    <div class="drawn">Drawn live</div>
    <div class="date">MAY 31</div>
    <div class="sub">11:59 PM ET · pick1.live</div>
  </div>
</div>
</body></html>
