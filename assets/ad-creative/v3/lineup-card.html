<!doctype html>
<html><head><meta charset="utf-8"/>
<!-- Daily lineup card — Activation #22. Tonight's top games + Pick1's
     pick highlighted. Shareable on IG Story / Twitter as branded daily
     touchpoint. 1080×1920 for IG Story; resize to 1080×1080 for feed. -->
<title>Daily lineup card</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@500;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1080px;background:#0a0b0d;color:#fff;font-family:'Archivo',sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
.frame{width:1080px;height:1080px;padding:60px 70px;display:flex;flex-direction:column;justify-content:space-between}
.header{display:flex;justify-content:space-between;align-items:center}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:18px;letter-spacing:0.24em;color:#d4ff3a;text-transform:uppercase;font-weight:700}
.eyebrow::before{content:'●';margin-right:10px;font-size:12px;vertical-align:middle}
.date{font-family:'JetBrains Mono',monospace;font-size:18px;letter-spacing:0.2em;color:#9095a0;text-transform:uppercase;font-weight:700}
.title{font-family:'Anton',sans-serif;font-size:96px;letter-spacing:-0.025em;text-transform:uppercase;line-height:0.95;margin-top:30px}
.title em{font-style:normal;color:#d4ff3a}
.games{margin-top:34px;display:flex;flex-direction:column;gap:14px}
.game{display:flex;align-items:center;gap:20px;padding:18px 22px;border:1px solid #1a1d22;border-radius:14px;background:#111317}
.game.pick{border-color:#d4ff3a;background:rgba(212,255,58,0.08)}
.game-time{font-family:'JetBrains Mono',monospace;font-size:14px;letter-spacing:0.15em;color:#9095a0;text-transform:uppercase;font-weight:700;width:80px;flex-shrink:0}
.game.pick .game-time{color:#d4ff3a}
.game-matchup{font-family:'Archivo',sans-serif;font-weight:800;font-size:22px;color:#fff;flex:1}
.game-line{font-family:'JetBrains Mono',monospace;font-size:14px;color:#9095a0;letter-spacing:0.1em;font-weight:700;text-align:right;width:120px}
.game.pick .game-line{color:#d4ff3a}
.game-conf{font-family:'JetBrains Mono',monospace;font-size:13px;color:#666b73;letter-spacing:0.1em;font-weight:700;width:80px;text-align:right}
.game.pick .game-conf{color:#fff;font-size:22px}
.pick-flag{font-family:'JetBrains Mono',monospace;font-size:13px;color:#0a0b0d;background:#d4ff3a;padding:6px 12px;border-radius:6px;letter-spacing:0.16em;font-weight:700;display:inline-block;margin-left:auto;text-transform:uppercase}
.footer{display:flex;justify-content:space-between;align-items:flex-end;margin-top:30px}
.logo{font-family:'Archivo',sans-serif;font-weight:900;font-size:42px;letter-spacing:-0.02em;color:#fff}
.logo .one{background:#d4ff3a;color:#0a0b0d;padding:2px 12px;border-radius:9px;margin-left:3px}
.url{font-family:'JetBrains Mono',monospace;font-size:18px;color:#9095a0;letter-spacing:0.12em;text-transform:uppercase;font-weight:700}
</style></head>
<body>
<div class="frame">
  <div>
    <div class="header">
      <div class="eyebrow">TONIGHT'S SLATE</div>
      <div class="date">MAY 15 · ET</div>
    </div>
    <div class="title">PICK1'S<br/><em>CALL</em> IS LOCKED.</div>
    <div class="games">
      <div class="game pick">
        <div class="game-time">8:00P</div>
        <div class="game-matchup">DEN @ MIN</div>
        <div class="game-line">over 224.5</div>
        <div class="game-conf">81%</div>
        <div class="pick-flag">PICK</div>
      </div>
      <div class="game">
        <div class="game-time">7:00P</div>
        <div class="game-matchup">BOS @ MIA</div>
        <div class="game-line">BOS -3.5</div>
        <div class="game-conf">67%</div>
      </div>
      <div class="game">
        <div class="game-time">7:30P</div>
        <div class="game-matchup">PHI @ NYK</div>
        <div class="game-line">over 218</div>
        <div class="game-conf">62%</div>
      </div>
      <div class="game">
        <div class="game-time">10:00P</div>
        <div class="game-matchup">LAL @ GSW</div>
        <div class="game-line">GSW -2.5</div>
        <div class="game-conf">58%</div>
      </div>
      <div class="game">
        <div class="game-time">10:30P</div>
        <div class="game-matchup">DAL @ LAC</div>
        <div class="game-line">over 222</div>
        <div class="game-conf">54%</div>
      </div>
    </div>
  </div>
  <div class="footer">
    <div class="logo">PICK<span class="one">1</span></div>
    <div class="url">PICK1.LIVE</div>
  </div>
</div>
</body></html>
