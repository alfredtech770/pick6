<!doctype html>
<html><head><meta charset="utf-8"/>
<!-- IG grid tile #6 — MIDDLE-RIGHT. Black dominant. Tonight's confidence
     dial. Visual proof that Pick1 quantifies its picks — not vibes,
     not "guaranteed locks". -->
<title>IG Tile 6 · Tonight's Pick</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@500;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1080px;background:#0a0b0d;color:#fff;font-family:'Archivo',sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
.frame{width:1080px;height:1080px;padding:80px;position:relative;display:flex;flex-direction:column;justify-content:space-between;
  background:radial-gradient(circle at 70% 30%, rgba(212,255,58,0.12) 0%, transparent 55%),#0a0b0d}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:22px;letter-spacing:0.28em;color:#d4ff3a;text-transform:uppercase;font-weight:700}
.eyebrow::before{content:'●';margin-right:14px;font-size:14px;vertical-align:middle}
.dial{display:flex;justify-content:center;margin:60px 0 20px}
.ring{width:560px;height:560px;border-radius:50%;border:24px solid #1a1d22;border-top-color:#d4ff3a;border-right-color:#d4ff3a;border-bottom-color:#d4ff3a;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-22deg);box-shadow:0 0 80px rgba(212,255,58,0.18) inset}
.ring-inner{transform:rotate(22deg);text-align:center}
.percent{font-family:'Anton',sans-serif;font-size:200px;line-height:0.9;letter-spacing:-0.04em;color:#d4ff3a}
.percent .sym{font-size:120px;vertical-align:top}
.dial-label{font-family:'JetBrains Mono',monospace;font-size:20px;letter-spacing:0.2em;color:#9095a0;text-transform:uppercase;font-weight:700;margin-top:14px}
.matchup{text-align:center}
.pick{font-family:'Anton',sans-serif;font-size:84px;line-height:0.95;letter-spacing:-0.025em;color:#fff;text-transform:uppercase}
.tip{font-family:'JetBrains Mono',monospace;font-size:20px;color:#9095a0;letter-spacing:0.16em;text-transform:uppercase;margin-top:14px}
.footer{display:flex;justify-content:space-between;align-items:flex-end}
.logo{font-family:'Archivo',sans-serif;font-weight:900;font-size:38px;letter-spacing:-0.02em;color:#fff}
.logo .one{background:#d4ff3a;color:#0a0b0d;padding:2px 12px;border-radius:9px;margin-left:3px}
.url{font-family:'JetBrains Mono',monospace;font-size:18px;color:#9095a0;letter-spacing:0.12em;text-transform:uppercase;font-weight:700}
</style></head>
<body>
<div class="frame">
  <div>
    <div class="eyebrow">TONIGHT · LOCKED PRE-GAME</div>
    <div class="dial">
      <div class="ring"><div class="ring-inner">
        <div class="percent">81<span class="sym">%</span></div>
        <div class="dial-label">AI CONFIDENCE</div>
      </div></div>
    </div>
  </div>
  <div class="matchup">
    <div class="pick">DENVER<br/>OVER 224.5</div>
    <div class="tip">TIP-OFF 8:00 PM ET</div>
  </div>
  <div class="footer">
    <div class="logo">PICK<span class="one">1</span></div>
    <div class="url">PICK1.LIVE</div>
  </div>
</div>
</body></html>
