<!doctype html>
<html><head><meta charset="utf-8"/>
<!-- IG grid tile #4 — MIDDLE-LEFT. Black dominant. The receipts wall:
     yesterday's win documented. Pick1's brand DNA = transparency, so
     this tile literally shows "we said X, result was Y". -->
<title>IG Tile 4 · Receipts</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@500;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1080px;background:#0a0b0d;color:#fff;font-family:'Archivo',sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
.frame{width:1080px;height:1080px;padding:80px;position:relative;display:flex;flex-direction:column;justify-content:space-between}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:22px;letter-spacing:0.28em;color:#d4ff3a;text-transform:uppercase;font-weight:700}
.eyebrow::before{content:'●';margin-right:14px;font-size:14px;vertical-align:middle}
.section{margin-top:48px}
.section-label{font-family:'JetBrains Mono',monospace;font-size:18px;letter-spacing:0.2em;color:#9095a0;text-transform:uppercase;font-weight:700;margin-bottom:14px}
.pick{font-family:'Anton',sans-serif;font-size:108px;line-height:0.95;letter-spacing:-0.025em;text-transform:uppercase}
.conf{font-family:'JetBrains Mono',monospace;font-size:38px;color:#d4ff3a;font-weight:700;letter-spacing:0.04em;margin-top:18px}
.divider{height:2px;background:#1a1d22;margin:48px 0}
.result-flag{display:inline-block;background:#22c55e;color:#0a0b0d;font-family:'JetBrains Mono',monospace;font-size:32px;font-weight:700;letter-spacing:0.16em;padding:8px 20px;border-radius:8px;text-transform:uppercase}
.result-pick{font-family:'Anton',sans-serif;font-size:96px;color:#fff;line-height:0.95;letter-spacing:-0.025em;margin-top:18px;text-transform:uppercase}
.result-margin{font-family:'JetBrains Mono',monospace;font-size:32px;color:#9095a0;margin-top:14px}
.footer{display:flex;justify-content:space-between;align-items:flex-end}
.logo{font-family:'Archivo',sans-serif;font-weight:900;font-size:38px;letter-spacing:-0.02em;color:#fff}
.logo .one{background:#d4ff3a;color:#0a0b0d;padding:2px 12px;border-radius:9px;margin-left:3px}
.tracker{font-family:'JetBrains Mono',monospace;font-size:18px;color:#9095a0;letter-spacing:0.12em;text-transform:uppercase;font-weight:700}
</style></head>
<body>
<div class="frame">
  <div>
    <div class="eyebrow">YESTERDAY'S CALL · PUBLIC LOG</div>
    <div class="section">
      <div class="section-label">PRE-GAME PICK</div>
      <div class="pick">SPURS<br/>+5.5</div>
      <div class="conf">78.6% AI CONFIDENCE</div>
    </div>
    <div class="divider"></div>
    <div>
      <div class="result-flag">✓ WIN</div>
      <div class="result-pick">126-97</div>
      <div class="result-margin">Spurs covered by 23.5</div>
    </div>
  </div>
  <div class="footer">
    <div class="logo">PICK<span class="one">1</span></div>
    <div class="tracker">PICK1.LIVE/TRACKER</div>
  </div>
</div>
</body></html>
