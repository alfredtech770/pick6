<!doctype html>
<html><head><meta charset="utf-8"/>
<title>Pick1 daily — streak</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@500;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1080px;background:#0a0b0d;color:#fff;font-family:'Archivo',sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
.frame{width:1080px;height:1080px;padding:80px;display:flex;flex-direction:column;justify-content:space-between;background:radial-gradient(circle at 50% 35%, rgba(212,255,58,0.12) 0%, transparent 55%),#0a0b0d}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:22px;letter-spacing:0.28em;color:#d4ff3a;text-transform:uppercase;font-weight:700}
.eyebrow::before{content:'●';margin-right:14px;font-size:14px;vertical-align:middle}
.label{font-family:'JetBrains Mono',monospace;font-size:24px;letter-spacing:0.2em;color:#9095a0;text-transform:uppercase;font-weight:700;margin-top:40px}
.record-row{display:flex;align-items:flex-start;gap:32px;margin-top:20px}
.wins{font-family:'Anton',sans-serif;font-size:380px;line-height:0.88;letter-spacing:-0.04em;color:#d4ff3a}
.dash{font-family:'Anton',sans-serif;font-size:220px;line-height:0.88;color:#1a1d22;align-self:center}
.losses{font-family:'Anton',sans-serif;font-size:380px;line-height:0.88;letter-spacing:-0.04em;color:#666b73}
.under{font-family:'JetBrains Mono',monospace;font-size:22px;letter-spacing:0.18em;color:#9095a0;text-transform:uppercase;font-weight:700;margin-top:20px}
.stat-row{display:flex;justify-content:space-between;gap:20px;margin-top:50px}
.stat{flex:1;border:1px solid #1a1d22;border-radius:14px;padding:24px 20px}
.stat-label{font-family:'JetBrains Mono',monospace;font-size:14px;letter-spacing:0.2em;color:#9095a0;text-transform:uppercase;font-weight:700;margin-bottom:10px}
.stat-value{font-family:'Anton',sans-serif;font-size:64px;line-height:1;color:#fff;letter-spacing:-0.025em}
.stat-value.green{color:#d4ff3a}
.footer{display:flex;justify-content:space-between;align-items:flex-end}
.logo{font-family:'Archivo',sans-serif;font-weight:900;font-size:42px;letter-spacing:-0.02em;color:#fff}
.logo .one{background:#d4ff3a;color:#0a0b0d;padding:2px 12px;border-radius:9px;margin-left:3px}
.cta{font-family:'JetBrains Mono',monospace;font-size:18px;color:#d4ff3a;letter-spacing:0.16em;text-transform:uppercase;font-weight:700}
</style></head>
<body>
<div class="frame">
  <div>
    <div class="eyebrow">PICK1 · LAST {{streak.window_days}} DAYS · PUBLIC LOG</div>
    <div class="label">RECORD</div>
    <div class="record-row">
      <div class="wins">{{streak.wins}}</div>
      <div class="dash">/</div>
      <div class="losses">{{streak.losses}}</div>
    </div>
    <div class="under">WINS · LOSSES{{#if streak.pending}} · {{streak.pending}} PENDING{{/if}}</div>
    <div class="stat-row">
      <div class="stat">
        <div class="stat-label">WIN RATE</div>
        <div class="stat-value green">{{streak.win_rate}}%</div>
      </div>
      <div class="stat">
        <div class="stat-label">AVG CONF</div>
        <div class="stat-value">{{streak.avg_confidence}}%</div>
      </div>
      <div class="stat">
        <div class="stat-label">CLV</div>
        <div class="stat-value green">{{streak.clv_label}}</div>
      </div>
    </div>
  </div>
  <div class="footer">
    <div class="logo">PICK<span class="one">1</span></div>
    <div class="cta">PICK1.LIVE/TRACKER</div>
  </div>
</div>
</body></html>
